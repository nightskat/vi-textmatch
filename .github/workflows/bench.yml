name: bench

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bench deps (pinned)
        run: python -m pip install -r bench/requirements.txt
      - name: Pairs are reproducible from the generator
        run: |
          python bench/gen_extended.py
          git diff --exit-code bench/pairs.jsonl
      - name: Gate — fail on any NEW false-equal
        run: python bench/run_bench.py --check --no-write --badge badge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-badge
          path: badge.json
