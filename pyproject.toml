[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-textmatch"
version = "0.2.0"
description = "Vietnamese text normalization and type-aware string comparison. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Tuan Khuc", email = "nightskat@gmail.com"}
]
keywords = [
    "vietnamese",
    "unicode",
    "normalization",
    "nfc",
    "diacritics",
    "tone-marks",
    "string-matching",
    "text-comparison",
    "fuzzy-matching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Vietnamese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
vi-textmatch = "vi_textmatch.cli:main"

[project.urls]
Homepage = "https://github.com/nightskat/vi-textmatch"
Repository = "https://github.com/nightskat/vi-textmatch"
Issues = "https://github.com/nightskat/vi-textmatch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vi_textmatch = ["py.typed"]
